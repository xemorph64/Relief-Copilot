<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relief Copilot — Admin</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--line:#262b36;--txt:#e6e9ef;--dim:#8b93a3;
        --ok:#3fb96f;--warn:#e2a03f;--bad:#e05252;--acc:#4f8dff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,-apple-system,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line)}
  h1{font-size:16px;margin:0}
  #live{font-size:12px;color:var(--dim)}#live.on{color:var(--ok)}
  nav{display:flex;gap:4px;padding:10px 22px 0}
  nav button{background:none;border:1px solid transparent;border-bottom:none;color:var(--dim);
             padding:8px 14px;cursor:pointer;border-radius:8px 8px 0 0;font-size:13px}
  nav button.act{color:var(--txt);background:var(--card);border-color:var(--line)}
  main{padding:16px 22px;max-width:1200px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
  th{color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  tr.cl{cursor:pointer}tr.cl:hover{background:#1d2230}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
  .REVIEW{background:#2a2313;color:var(--warn)} .DELIVERED,.WATCHING{background:#12321f;color:var(--ok)}
  .NEEDS_HUMAN{background:#33161a;color:var(--bad)} .NEW,.INTAKE,.CLARIFY{background:#16283d;color:var(--acc)}
  .amt{font-variant-numeric:tabular-nums}
  .grid{display:grid;grid-template-columns:1fr 340px;gap:14px}
  .bar{height:16px;background:var(--acc);border-radius:3px;min-width:2px}
  .row{display:flex;align-items:center;gap:10px;margin:6px 0}
  .row .lbl{width:170px;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .n{width:30px;text-align:right;font-size:12px}
  .ev{font-size:12px;padding:4px 0;border-bottom:1px solid var(--line)}
  .ev b{color:var(--acc);font-weight:600}
  .ev .t{color:var(--dim);font-size:11px;margin-left:6px}
  pre{background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:12px}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:3px 10px;font-size:13px}
  .kv span:nth-child(odd){color:var(--dim)}
  #detail{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none}
  #detail.on{display:block}
  #detail .pane{position:absolute;right:0;top:0;bottom:0;width:560px;background:var(--bg);
                border-left:1px solid var(--line);padding:20px;overflow:auto}
  h3{margin:6px 0 10px;font-size:14px}
  .close{float:right;background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer}
</style>
</head>
<body>
<header><h1>🌊 Relief Copilot — Admin</h1><span id="live">● connecting</span></header>
<nav>
  <button data-tab="queue" class="act">Review queue</button>
  <button data-tab="districts">District dashboard</button>
</nav>
<main id="queue">
  <div class="card"><table id="tbl">
    <thead><tr><th>ID</th><th>State</th><th>Applicant</th><th>District</th><th>Assets</th><th>₹ computed</th><th>Conf.</th><th>Updated</th></tr></thead>
    <tbody></tbody></table></div>
</main>
<main id="districts" style="display:none">
  <div class="card"><h3>Claims filed per district (filing density)</h3><div id="dchart"></div>
    <p style="color:var(--dim);font-size:12px">Districts hit by a hazard with near-zero filings are the circles to
    reach — overlay hazard exposure once the affected-taluka GR lists are ingested.</p></div>
</main>
<div id="detail"><div class="pane">
  <button class="close" onclick="document.getElementById('detail').classList.remove('on')">×</button>
  <div id="dbody"></div>
</div></div>
<script>
let claims=[], es=null;
const $=q=>document.querySelector(q);
function money(n){return n==null?'—':'₹'+n.toLocaleString('en-IN')}
function minConf(f){const c=[f.hazard_confidence,f.incident_date_confidence,f.applicant_name_confidence,f.village_confidence,
  ...(f.assets||[]).map(a=>a.confidence)].filter(x=>x!=null);return c.length?Math.min(...c):null}
function load(){fetch('/api/claims').then(r=>r.json()).then(cs=>{claims=cs;
  claims.sort((a,b)=>(a.state==='NEEDS_HUMAN'?0:a.state==='REVIEW'?1:2)-(b.state==='NEEDS_HUMAN'?0:b.state==='REVIEW'?1:2));
  render()})}
function render(){
  $('#tbl tbody').innerHTML=claims.map(c=>{const f=c.facts||{};
    return `<tr class="cl" onclick="openDetail(${c.id})">
      <td>RC-${String(c.id).padStart(6,'0')}</td>
      <td><span class="badge ${c.state}">${c.state}</span></td>
      <td>${(f.applicant_name||'—').slice(0,24)}</td>
      <td>${f.district||'—'}</td>
      <td>${(f.assets||[]).length}</td>
      <td class="amt">${money((c.results||[]).reduce((s,r)=>s+(r.amount||0),0))}</td>
      <td class="amt">${minConf(f)==null?'—':minConf(f).toFixed(2)}</td>
      <td>${new Date(c.updated*1000).toLocaleString('en-IN',{dateStyle:'short',timeStyle:'short'})}</td></tr>`}).join('');
  const d={};claims.forEach(c=>{const x=(c.facts||{}).district;if(x)d[x]=(d[x]||0)+1});
  const mx=Math.max(1,...Object.values(d));
  $('#dchart').innerHTML=Object.entries(d).sort((a,b)=>b[1]-a[1]).map(([k,n])=>
    `<div class="row"><div class="lbl" title="${k}">${k}</div>
     <div class="bar" style="flex:1;width:${100*n/mx}%"></div><div class="n">${n}</div></div>`).join('')||'<p>No claims yet.</p>';
}
async function openDetail(id){
  const d=await fetch('/api/claims/'+id).then(r=>r.json());
  const c=d.claim,f=c.data.facts||{};
  $('#dbody').innerHTML=`<h3>RC-${String(c.id).padStart(6,'0')} <span class="badge ${c.state}">${c.state}</span></h3>
   <div class="card"><div class="kv">
    <span>Applicant</span><span>${f.applicant_name||'—'} (⋯${c.phone.slice(-2)})</span>
    <span>Village / Taluka</span><span>${f.village||'—'} / ${f.taluka||'—'}</span>
    <span>District</span><span>${f.district||'—'} ${c.data.location?'📍 GPS':''}</span>
    <span>Hazard · Date</span><span>${f.hazard||'—'} · ${f.incident_date||'—'}</span>
    <span>Rainfall (3-day max)</span><span>${c.data.rainfall?c.data.rainfall.max_3day_mm+' mm — '+c.data.rainfall.source:'—'}</span>
    <span>Photos</span><span>${(c.data.photos||[]).length}</span></div></div>
   <div class="card">${(c.data.results||[]).map(r=>`<div class="kv">
     <span>${r.asset.asset_class} ×${r.asset.quantity}</span><span>
       ${r.verdict==='ELIGIBLE'?money(r.amount):r.verdict} ${r.rule_id||''}
       ${r.citation?`<div style="color:var(--dim);font-size:12px">${r.citation}</div>`:''}</span></div>`).join('')||'—'}</div>
   <div class="card"><h3>Event log</h3>${d.events.slice().reverse().slice(0,40).map(e=>
     `<div class="ev"><b>${e.kind}</b> <span class="t">${new Date(e.ts*1000).toLocaleTimeString('en-IN')}</span>
      <div style="color:var(--dim)">${JSON.stringify(e.payload).slice(0,160)}</div></div>`).join('')}</div>`;
  $('#detail').classList.add('on');
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('act',x===b));
  $('#queue').style.display=b.dataset.tab==='queue'?'':'none';
  $('#districts').style.display=b.dataset.tab==='districts'?'':'none';});
function connect(){
  es=new EventSource('/api/events/stream');
  es.onopen=()=>$('#live').textContent='● live';
  es.onerror=()=>{$('#live').textContent='● reconnecting';$('#live').classList.remove('on')};
  es.onmessage=m=>{$('#live').classList.add('on');load()};
}
connect();load();setInterval(load,30000);
</script>
</body>
</html>
